name: 'Desk B: BH1750 + LD2410 faults, lux regulation, colour schedule'
version: 1
author: A
steps:
- wait-serial: tasks started
- write-serial: 'presence on

    '
- wait-serial: UNOCCUPIED -> WORKING
- write-serial: 'fault bh1750

    '
- wait-serial: REGULATING -> SENSOR_FAULT
- delay: 400ms
- take-screenshot:
    part-id: oled
    save-to: out/desk_b/01_light_sensor_fault.png
- write-serial: 'status

    '
